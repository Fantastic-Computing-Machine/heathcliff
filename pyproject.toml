[project]
name = "heathcliff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.4.0",
    "duckduckgo-search>=8.1.1",
    "google-auth-oauthlib>=1.2.4",
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.5",
    "langchain-google-community>=3.0.2",
    "langchain-google-genai>=4.1.2",
    "langfuse>=3.11.2",
    "langgraph>=1.0.5",
    "langsmith>=0.5.1",
    "mem0ai>=1.0.1",
    "playwright>=1.57.0",
    "openwakeword>=0.6.0",
    "pyaudio>=0.2.14",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.5",
    "pyttsx3>=2.99",
    "speechrecognition>=3.14.4",
    "spotipy>=2.25.2",
    "streamlit>=1.52.2",
    "uvicorn>=0.40.0",
    "wikipedia>=1.4.0",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "pre-commit>=3.6.0",
    "pytest>=8.0.0",
]

[tool.isort]
profile = "black"
line_length = 88

[tool.black]
line-length = 88
