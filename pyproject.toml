[project]
name = "heathcliff"
version = "0.1.0"
description = "Heathcliff is a personal AI assistant that can help you with a variety of tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.4.0",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.129.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.2.0",
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.5",
    "langchain-google-community>=3.0.2",
    "langchain-google-genai>=4.1.2",
    "langchain-tavily",
    "langfuse>=3.11.2",
    "langgraph>=1.0.5",
    "mediawikiapi>=1.3",
    "mem0ai>=1.0.1",
    "pvporcupine>=3.0.5",
    "pyaudio>=0.2.14",
    "pyttsx3>=2.99",
    "pyowm>=3.5.0",
    "python-dotenv>=1.2.1",
    "python-telegram-bot>=22.5",
    "speechrecognition>=3.14.4",
    "spotipy>=2.25.2",
    "stackapi>=0.3.1",
    "streamlit>=1.52.2",
    "uvicorn>=0.40.0",
    "wikibase-rest-api-client>=0.2.5",
    "wikipedia>=1.4.0",
    "yfinance>=1.2.0",
    "youtube-search>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F401", "I"]
fixable = ["F401", "I"]

[tool.ruff.lint.isort]
known-first-party = [
    "core",
    "config",
    "skills",
    "utils",
    "ui",
    "voice",
    "instructions",
]
