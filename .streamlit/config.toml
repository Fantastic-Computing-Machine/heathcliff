[theme]
font = "sans serif"
base = "dark"

[client]
toolbarMode = "minimal"
showErrorDetails = "full"

[logger]
level = "info"

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[server]
headless = true
runOnSave = true
maxUploadSize = 200
enableXsrfProtection = true

[ui]
hideTopBar = false

[global]
showWarningOnDirectExecution = true