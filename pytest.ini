# ABOUTME: Pytest configuration for Heathcliff test suite
# ABOUTME: Configures test discovery and warning filters

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning:speech_recognition.*
    ignore::DeprecationWarning:audioop.*
    ignore::DeprecationWarning:aifc.*
